name: Windows offline release

on:
  push:
    tags:
      - "v*-r03"
      - "v*-r04"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out C-Lab
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install the pinned Tauri CLI
        run: npm ci

      - name: Verify course records and frontend syntax
        shell: pwsh
        run: |
          py -3 tools/check_foundation.py --release
          node --check design/studio.js
          node --check design/runtime.js
          node --check design/learning.js
          node --check tools/test_desktop_r03.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test catalog import and storage migrations
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Build the small Windows installer
        run: npm run tauri:build:windows

      - name: Ensure the test runner has WebView2
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'
          $runtime = Get-ChildItem -LiteralPath $runtimeRoot -Filter 'msedgewebview2.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) {
            $bootstrap = Join-Path $env:RUNNER_TEMP 'clab-webview-bootstrap.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrap
            $setup = Start-Process -FilePath $bootstrap -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "WebView2 prerequisite installation failed: $($setup.ExitCode)" }
          }

      - name: Verify the native offline learning pilot
        run: node tools/test_desktop_r03.mjs src-tauri/target/release/machine-room.exe src-tauri/target/r03-native-evidence tools/audit_desktop_r04.mjs

      - name: Preserve native integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r03-native-evidence
          path: |
            src-tauri/target/r03-native-evidence/evidence.json
            src-tauri/target/r03-native-evidence/*.png
          if-no-files-found: ignore

      - name: Check installer size
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath '.\src-tauri\target\release\bundle\nsis' -Filter '*setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer is missing.' }
          if ($installer.Length -gt 30MB) { throw 'Default installer exceeded 30 MiB; check for bundled runtime or unintended resources.' }
          Write-Output "Default installer: $($installer.Length) bytes"

      - name: Smoke launch with WebView network blocked
        shell: pwsh
        run: .\tools\smoke_tauri_offline.ps1 -Executable .\src-tauri\target\release\machine-room.exe

      - name: Publish downloadable R03 pilot
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -LiteralPath '.\src-tauri\target\release\bundle\nsis' -Filter '*setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Tauri did not produce an NSIS setup executable.' }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $installer.FullName --repo $env:GITHUB_REPOSITORY --verify-tag --title 'Machine Room - verified offline learning pilot' --notes-file .github/release-notes-r04.md --prerelease
          }
